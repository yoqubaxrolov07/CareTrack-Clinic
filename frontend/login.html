<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CareTrack Clinic</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo">
        <i data-lucide="heart-pulse" style="width:48px;height:48px;color:var(--accent);margin-bottom:12px;"></i>
        <h1>CareTrack Clinic</h1>
        <p>Medical Record Management System</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control"
                 placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control"
                 placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          Sign In
        </button>
      </form>

      <p style="text-align:center; margin-top:20px; font-size:12px; color:#999;">
        CareTrack Clinic &copy; 2026 | Staff Portal
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/login.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
